<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd23f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="台湾華語">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>台湾華語 練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 明るく元気、ゲームのように軽快な練習帳
   IDEA: 夜市の屋台の色札とシールが貼られた単語カード
   PICTURE: 声調ごとに色分けされた漢字と、音の高さの軌跡
   COLOUR and TYPE: 1聲ピンク・2聲イエロー・3聲ミント・4聲ブルー / Zen Maru Gothic + Noto Sans TC
   LAYOUT: スマホ1カラム、上にカード、下に大きな声調ボタン */
:root{color-scheme:light dark;
--bg:light-dark(#fff8ec,#1c1826);--card:light-dark(#ffffff,#2a2537);--ink:light-dark(#2b2140,#f6f1ff);--sub:light-dark(#7a6f8e,#b9b0cc);
--line:light-dark(#2b2140,#0d0b12);--sun:#ffd23f;
--t1:#ff4d7d;--t2:#ffae00;--t3:#18c29c;--t4:#4c7dff;
--t5:#a59bbb;
--k1:light-dark(#e8215c,#ff6f97);--k2:light-dark(#e08a00,#ffc23d);--k3:light-dark(#079a79,#3fe0b8);--k4:light-dark(#2f62e8,#86a8ff);--k5:light-dark(#8a809e,#b9b0cc)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Maru Gothic",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.hz,.zy,[lang|=zh]{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{max-width:540px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--t4);outline-offset:3px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:900;line-height:1.2}
.ib{flex:none;width:44px;height:44px;border-radius:14px;background:var(--card);border:2.5px solid var(--line);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.ib:active,.btn:active,.tb:active,.mn:active,.cell:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.hero{margin:4px 16px 18px;border-radius:28px;background:var(--sun);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);padding:22px 20px 18px;color:#2b2140;position:relative;overflow:hidden}
.hero h2{font-size:clamp(32px,9vw,44px);line-height:1.05;margin:0 0 6px;font-weight:900;text-wrap:balance;position:relative}
.hero p{margin:0 0 14px;font-weight:700;position:relative}
.dots{position:absolute;inset:0;background:radial-gradient(#fff6 2px,transparent 2.5px) 0 0/18px 18px;pointer-events:none}
.ma{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:relative}
.ma button{background:#fff;border:2.5px solid #2b2140;border-radius:18px;padding:8px 2px 6px;text-align:center;box-shadow:0 3px 0 #2b2140;color:#2b2140}
.ma .hz{font-size:30px;font-weight:900;line-height:1.1;display:block}
.ma small{font-size:13px;font-weight:700;display:block}
.ma svg{display:block;margin:2px auto 0}
.sec{padding:0 16px;margin:18px 0 8px;font-size:15px;color:var(--sub);font-weight:700}
.mn{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:0 16px 12px;background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:14px 16px;text-align:left}
.mn b{display:block;font-size:18px;line-height:1.25}
.mn span.s{font-size:14px;color:var(--sub);display:block}
.mn .tag{font-size:12px;font-weight:900;background:var(--sun);color:#2b2140;border:2px solid var(--line);border-radius:10px;padding:0 6px;margin-left:6px;vertical-align:2px}
.ico{flex:none;width:58px;height:58px;border-radius:18px;border:2.5px solid var(--line);display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff}
.ico.hz{font-size:30px}
.chev{margin-left:auto;flex:none;font-weight:900;font-size:20px;color:var(--sub)}
.lv{margin:0 16px 14px;background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);overflow:hidden}
.lvh{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.badge{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;border:2.5px solid var(--line)}
.lvh b{display:block;font-size:18px;line-height:1.2}
.lvh span{font-size:14px;color:var(--sub)}
.stars{margin-left:auto;font-size:18px;letter-spacing:1px;white-space:nowrap;color:var(--t2)}
.stars i{font-style:normal;color:light-dark(#e6ddcf,#4a4258)}
.lvb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;padding:0 16px 16px}
.btn{min-height:48px;border-radius:16px;border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:900;font-size:16px;padding:8px 14px;background:var(--card)}
.btn.go{color:#fff}
.btn[disabled]{opacity:.5}
.grid{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr));gap:8px;padding:0 16px;align-items:center}
.gh{font-weight:900;text-align:center;font-size:14px}
.cell{aspect-ratio:1/1.05;border-radius:18px;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;overflow:hidden;background:var(--card);padding:0}
.cell .bar{display:flex;height:42%}
.cell .bar i{flex:1}
.cell .nm{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.15}
.cell .nm b{font-size:clamp(14px,4.2vw,18px)}
.cell .nm small{font-size:13px;color:var(--sub);font-weight:700}
.card{margin:6px 16px 16px;background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--line);padding:16px 12px 18px;text-align:center;position:relative}
.prog{height:12px;margin:0 16px 12px;border-radius:9px;background:light-dark(#efe5d4,#3a3348);overflow:hidden;border:2px solid var(--line)}
.prog i{display:block;height:100%;background:var(--t3);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:700;padding:0 6px 6px}
.word{display:flex;justify-content:center;gap:clamp(6px,3vw,16px);flex-wrap:wrap;margin:6px 0 10px}
.syl{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(62px,19vw,88px)}
.syl .hz{font-size:clamp(40px,12vw,56px);font-weight:900;line-height:1}
.syl .hz.q{color:light-dark(#d9cfbf,#544b65)}
.slot{width:100%;height:54px;border-radius:16px;border:3px dashed light-dark(#cfc3b0,#5a5170);display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px;position:relative}
.slot.cur{border-color:var(--ink);border-style:solid;animation:pulse 1s infinite}
.slot[data-t]{border:3px solid var(--line)}
.slot.t2,.slot.t3{color:#2b2140}
.slot svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);opacity:.35}
.slot em{font-style:normal;position:relative}
.mk{position:absolute;top:-12px;right:-10px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;border:2.5px solid var(--line);box-sizing:border-box;line-height:0}.mk svg{width:100%;height:100%;display:block}
.ok{background:var(--t3)}.ng{background:var(--t1)}
.py{font-size:18px;font-weight:700}
.zy{font-size:17px;font-weight:700;color:var(--sub)}
.fix{font-size:13px;font-weight:700}
.mean{font-size:17px;font-weight:700;margin:4px 0 6px}
.dn{font-size:13px;color:var(--sub);margin:0 0 10px}
.plays{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pb{min-height:48px;border-radius:24px;padding:6px 18px;font-weight:900;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--sun);color:#2b2140;display:inline-flex;align-items:center;gap:6px}
.pb.alt{background:var(--card);color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 16px}
.tb{min-height:84px;border-radius:20px;color:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:16px}
.tb small{font-size:13px;opacity:.95}
.tb.t2,.tb.t3{color:#2b2140}
.row{display:flex;gap:10px;padding:14px 16px 0}
.row .btn{flex:1}
.fb{margin:0 16px 12px;padding:12px 16px;border-radius:18px;font-weight:900;text-align:center;border:3px solid var(--line);font-size:18px}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}
.c1{color:var(--k1)}.c2{color:var(--k2)}.c3{color:var(--k3)}.c4{color:var(--k4)}.c5{color:var(--k5)}
.t5{background:var(--t5)}
.pad.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.cover{min-height:100dvh;background:var(--sun);color:#2b2140;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px)}
.cover .chips{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.cover .chips span{background:#fff;border:2.5px solid #2b2140;border-radius:14px;padding:2px 10px;font-size:13px;font-weight:900}
.cover h1{font:400 clamp(46px,14vw,68px)/1.05 "Mochiy Pop One","Zen Maru Gothic",sans-serif;margin:18px 0 8px;position:relative;letter-spacing:1px}
.cover h1 span{display:inline-block;-webkit-text-stroke:7px #2b2140;paint-order:stroke fill;text-shadow:0 5px 0 #2b2140}
.cover h1 span:nth-child(odd){transform:rotate(-4deg)}.cover h1 span:nth-child(even){transform:rotate(3deg) translateY(4px)}
.cover .lead{font:400 17px/1.5 "Mochiy Pop One","Zen Maru Gothic",sans-serif;margin:0 0 18px;position:relative}
.cover .chips span{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400}
.pitch{position:relative;background:#fff;border:3px solid #2b2140;border-radius:28px;box-shadow:0 6px 0 #2b2140;padding:12px 10px 12px;margin-bottom:24px}
.pitch svg{display:block;width:100%;height:auto}
.pills4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.pills4 button{min-height:52px;border-radius:16px;border:2.5px solid #2b2140;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-weight:900;font-size:16px;color:#2b2140}
.pills4 .zy{font-size:14px}
.pills4 .p1{color:#e8215c}.pills4 .p2{color:#e08a00}.pills4 .p3{color:#079a79}.pills4 .p4{color:#2f62e8}
.zrib{position:absolute;right:-30px;bottom:40px;transform:rotate(-8deg);font:900 28px/1 "Noto Sans TC",sans-serif;color:#2b214022;white-space:nowrap;letter-spacing:6px}
.start{margin-top:4px;position:relative;min-height:60px;border-radius:30px;border:3px solid #2b2140;box-shadow:0 6px 0 #2b2140;background:#2b2140;color:#fff;font-size:20px;font-weight:900}
.toc{padding:0 16px}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:12px 14px;margin-bottom:8px}
.ch .no{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;border:2.5px solid var(--line)}
.ch b{display:block;font-size:18px;line-height:1.25}.ch span.s{display:block;font-size:14px;color:var(--sub)}
.subs{display:grid;gap:6px;margin:0 0 14px 28px;padding-left:14px;border-left:3px dotted var(--sub)}
.sb{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px;font-weight:900}
.sb .hz{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:17px;border:2px solid var(--line)}
.sb small{margin-left:auto;color:var(--sub);font-weight:700;font-size:13px;white-space:nowrap}
.word.cmp{gap:8px 6px}
.word.cmp .syl{width:46px;gap:4px}
.word.cmp .syl .hz{font-size:30px}
.word.cmp .slot{height:40px;border-radius:12px;font-size:12px}
.word.cmp .py{font-size:13px}.word.cmp .zy{font-size:12px}.word.cmp .fix{font-size:11px}
.word.cmp .mk{width:20px;height:20px;font-size:11px;top:-8px;right:-6px}
.li.sent .hz{font-size:23px;flex:1 1 100%;letter-spacing:0}
.li.sent{flex-wrap:wrap;gap:4px 12px}
.li.sent .tx{flex:1 1 100%}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.legend span{font-size:13px;font-weight:900;border:2px solid var(--line);border-radius:12px;padding:2px 10px}
.legend .t1,.legend .t4,.legend .t5{color:#fff}.legend .t2,.legend .t3{color:#2b2140}
.list{display:grid;gap:10px;padding:0 16px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 3px 0 var(--line);text-align:left;width:100%}
.li .hz{font-size:32px;font-weight:900;line-height:1.1;flex:none;letter-spacing:1px}
.li .tx{flex:1}
.li .tx div{font-weight:700;line-height:1.35}
.li .tx .zy{font-size:15px}
.li .tx small{color:var(--sub);font-size:14px;display:block}
.li .tx small.n{font-size:12.5px}
.tone{display:flex;gap:14px;align-items:center;background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 3px 0 var(--line);margin:0 16px 12px;width:calc(100% - 32px);text-align:left}
.tone .sw{flex:none;width:76px;height:64px;border-radius:16px;border:2.5px solid var(--line);display:grid;place-items:center}
.tone b{font-size:18px}
.tone p{margin:2px 0 0;font-size:15px;color:var(--sub)}
.note{margin:4px 16px 16px;padding:14px 16px;border-radius:20px;background:var(--card);border:2.5px dashed var(--sub);font-size:15px}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{width:100%;max-width:540px;background:var(--bg);border-radius:28px 28px 0 0;border:3px solid var(--line);padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:20px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-bottom:2px dashed light-dark(#e6dccb,#3d3550);font-weight:700}
.sw2{-webkit-appearance:none;appearance:none;padding:0;margin:0;box-sizing:border-box;width:60px;height:34px;border-radius:17px;background:light-dark(#ddd2c0,#4a4258);border:2.5px solid var(--line);position:relative;flex:none;overflow:hidden}
.sw2::after{content:"";box-sizing:border-box;position:absolute;top:50%;left:2px;width:25px;height:25px;margin-top:-12.5px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:transform .2s}
.sw2[aria-checked=true]{background:var(--t3)}.sw2[aria-checked=true]::after{transform:translateX(26px)}
.vinfo{font-size:14px;color:var(--sub);margin:10px 0 0}
.big{font-size:clamp(56px,18vw,84px);font-weight:900;line-height:1;margin:6px 0}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.conf i{position:absolute;top:-20px;width:12px;height:12px;border-radius:3px;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.slot.cur{animation:none}.conf{display:none}}
.twl{position:relative;align-self:flex-start;margin-top:18px;font:400 clamp(24px,7vw,32px)/1 "Mochiy Pop One","Zen Maru Gothic",sans-serif;background:#2b2140;color:#fff;border-radius:16px;padding:8px 14px 9px;transform:rotate(-3deg);letter-spacing:2px}
.tag{font-size:12px;font-weight:900;background:var(--sun);color:#2b2140;border:2px solid var(--line);border-radius:10px;padding:0 6px;margin-left:8px;vertical-align:2px}
.chat{display:flex;flex-direction:column;gap:12px;padding:0 16px}
.bub{align-self:flex-start;max-width:86%;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:6px 22px 22px 22px;box-shadow:0 3px 0 var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.bub.r{align-self:flex-end;border-radius:22px 6px 22px 22px;background:light-dark(#fff3c4,#3a3348)}
.bub .sp{font-size:12px;font-weight:900;color:var(--sub)}
.bub .hz{font-size:24px;font-weight:900;line-height:1.3}
.bub .py{font-size:15px}.bub .zy{font-size:14px}.bub .ja{font-size:14px;color:var(--sub)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:0 16px}
.zt{border:2.5px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--line);padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.2;border-top:8px solid var(--g)}
.zt .zy{font-size:30px;color:var(--ink);font-weight:900}
.zt b{font-size:15px}.zt small{font-size:12px;color:var(--sub)}
.zbig{font-size:84px;font-weight:900;line-height:1.1;margin:6px 0;display:flex;justify-content:center}
.zbig.zy{color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 14px}
.opts.one{grid-template-columns:1fr}
.op{min-height:60px;border-radius:18px;border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);background:var(--card);font-size:22px;font-weight:900}
.op.zy{color:var(--ink);font-size:24px;letter-spacing:2px}
.op.good{background:var(--t3);color:#2b2140}.op.bad{background:var(--t1);color:#fff}
.op[disabled]{opacity:1}
.zboxes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.zbox{display:flex;flex-direction:column;align-items:center;gap:4px}
.zin{min-width:92px;height:58px;border-radius:16px;border:3px dashed light-dark(#cfc3b0,#5a5170);display:grid;place-items:center;font-size:26px;color:var(--ink);padding:0 8px}
.zin.cur{border-style:solid;border-color:var(--ink)}
.zin.good{border:3px solid var(--line);background:var(--t3);color:#2b2140}.zin.bad{border:3px solid var(--line);background:var(--t1);color:#fff}
.kb{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;padding:0 12px}
.k{min-height:46px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--card);font-size:20px;color:var(--ink);border-bottom:5px solid var(--g,var(--line));padding:0}
.k:active{transform:translateY(2px);box-shadow:none}
.k.del{grid-column:span 3;font-size:18px}
.kt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 12px 0}
.kt .k{min-height:54px;color:#fff;font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.kt .k small{font-size:11px}
.kt .k.t1{background:var(--t1)}.kt .k.t2{background:var(--t2)}.kt .k.t3{background:var(--t3)}.kt .k.t4{background:var(--t4)}
.kt .k.t2,.kt .k.t3{color:#2b2140}
.cover{align-items:center;text-align:center}
.cin{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}

/* 形の比較：大きさと位置をそろえてから、線どうしの距離で比べる */
function zwNorm(draw,G=64,B=50){const S=256,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');draw(x,S);const d=x.getImageData(0,0,S,S).data;
 let x0=S,y0=S,x1=-1,y1=-1;for(let y=0;y<S;y++)for(let xx=0;xx<S;xx++)if(d[(y*S+xx)*4+3]>90){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)return null;const w=x1-x0+1,h=y1-y0+1,k=B/Math.max(w,h),o=document.createElement('canvas');o.width=o.height=G;const ox=o.getContext('2d');
 ox.drawImage(c,x0,y0,w,h,(G-w*k)/2,(G-h*k)/2,w*k,h*k);const e=ox.getImageData(0,0,G,G).data,m=new Uint8Array(G*G);for(let j=0;j<G*G;j++)m[j]=e[j*4+3]>70?1:0;return{m,ar:w/h}}
function zwDT(m,G){const D=new Float32Array(G*G);for(let j=0;j<G*G;j++)D[j]=m[j]?0:1e9;
 for(let y=0;y<G;y++)for(let x=0;x<G;x++){const j=y*G+x;if(x)D[j]=Math.min(D[j],D[j-1]+1);if(y)D[j]=Math.min(D[j],D[j-G]+1);if(x&&y)D[j]=Math.min(D[j],D[j-G-1]+1.4);if(y&&x<G-1)D[j]=Math.min(D[j],D[j-G+1]+1.4)}
 for(let y=G-1;y>=0;y--)for(let x=G-1;x>=0;x--){const j=y*G+x;if(x<G-1)D[j]=Math.min(D[j],D[j+1]+1);if(y<G-1)D[j]=Math.min(D[j],D[j+G]+1);if(x<G-1&&y<G-1)D[j]=Math.min(D[j],D[j+G+1]+1.4);if(y<G-1&&x)D[j]=Math.min(D[j],D[j+G-1]+1.4)}return D}
function zwScore(strokes,sym){const G=64;const A=zwNorm((x,S)=>inkDraw(x,S,strokes,S*.045,'#000'),G),Bm=zwNorm((x,S)=>{x.font=`400 ${S*.8}px ${ZWF}`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.fillText(sym,S/2,S*.52)},G);
 if(!A||!Bm)return{res:1,p:0,r:0};const dA=zwDT(A.m,G),dB=zwDT(Bm.m,G),T=3.2;let na=0,pa=0,nb=0,rb=0,sa=0;
